																		&lt;p style=&quot;margin: 0; text-align: left; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;br&gt;&lt;strong&gt;Pre-Gunite Inspection&lt;/strong&gt;&lt;br&gt;Prior to the Gunite application, our Project Manager and a building inspector will conduct a thorough Quality, Code, and Safety inspection to ensure that the excavation, steel, and plumbing works have been executed correctly. This inspection is vital for maintaining the standards and safety of your project.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Gunite Shell Construction&lt;/strong&gt;&lt;br&gt;It is essential to move all vehicles away from our access point, as our material trucks will be on-site possibly for the entire day. Our crew will also require access to outdoor water and an electrical outlet.&lt;br&gt;&lt;br&gt;During this phase, our crew will apply concrete through a large hose and meticulously shape it to form the walls and floor of your pool or spa. Once dry, the concrete shell will exhibit a rough texture, ensuring the interior finish adheres well.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Curing Process&lt;/strong&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; text-align: left; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;Following the Gunite application, it’s essential to initiate the curing process which entails wetting down the pool shell for 7-10 days, starting the day after the shell completion. This process can be carried out by:&lt;br&gt;&lt;br&gt;Spraying a stream of water from your garden hose, ensuring the walls, floor, and top of the pool are thoroughly wet until water puddles at the bottom.&lt;br&gt;&lt;br&gt;Alternatively, you may place a sprinkler in the middle of the pool, turning it on and off throughout the day. Rain is beneficial during this phase as it aids in the curing process, reducing the need for manual spraying.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Scheduling and Payments&lt;/strong&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; text-align: left; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;For scheduling details and payment processing, please refer to the client portal. All schedule updates and payment reminders will be available there for your convenience.&lt;/p&gt;

																		&lt;p style=&quot;margin: 0; text-align: left; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;br&gt;&lt;strong&gt;Pre-Gunite Inspection&lt;/strong&gt;&lt;br&gt;Before gunite goes in, our Project Manager and a building inspector will run a quality, code, and safety inspection on the excavation, steel, and plumbing. This confirms everything meets standards before we move forward.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Gunite Shell Construction&lt;/strong&gt;&lt;br&gt;Please clear all vehicles from our access point — material trucks will be on-site, possibly all day. We&#x27;ll also need access to outdoor water and an electrical outlet.&lt;br&gt;&lt;br&gt;During gunite, our crew sprays concrete through a large hose and shapes the walls and floor of your pool or spa. Once dry, the shell has a rough texture so the interior finish bonds properly.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Curing Process&lt;/strong&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; text-align: left; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;After gunite, the shell needs to cure for 7–10 days, starting the day after completion. Wet the walls, floor, and top of the pool until water pools at the bottom. You can use a garden hose or place a sprinkler in the pool and run it on and off throughout the day. Rain helps too — it speeds curing and cuts down on manual spraying.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Scheduling and Payments&lt;/strong&gt;&lt;/p&gt;
