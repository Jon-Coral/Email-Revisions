																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;&lt;strong&gt;Plastering Process&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;Our experienced crew will carry out the plastering process, preparing and applying the plaster to form the final interior surface of your pool.&lt;/span&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 18px;&quot;&gt;&amp;nbsp;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;&lt;strong&gt;Important: Plaster Color Release Form&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;Before we begin plastering, it is essential that you have signed the Plaster Color Release Form. This form confirms your choice of plaster color and acknowledges the characteristics of the materials used. If you have already completed this form, please disregard this reminder. If not, please do so as soon as possible, as we cannot proceed with plastering your pool without this crucial step. You can access and sign the form &lt;strong&gt;&lt;a target=&quot;_blank&quot; href=&quot;https://www.jotform.com/build/233460973778167&quot; style=&quot;text-decoration: underline; color: #0068A5;&quot; rel=&quot;noopener&quot;&gt;here&lt;/a&gt;&lt;/strong&gt;.&lt;/span&gt;&lt;/p&gt;

																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;Post plastering, the filling process will commence immediately and continue until the water level reaches the center of the tile line. It’s imperative that the water flow remains uninterrupted during the filling to prevent any marking on the new plaster.&lt;/span&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 18px;&quot;&gt;&amp;nbsp;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;strong&gt;General Filling Guidelines&lt;/strong&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;-You are responsible for filling your pool and all related expenses.&lt;br&gt;&lt;br&gt;-If your pool has an attached spa, ensure to fill the pool first and not allow water to overflow from the spa into the pool.&lt;br&gt;&lt;br&gt;-If you are utilizing well water:&lt;br&gt;&lt;br&gt;Due to the risk of staining from excessive mineral content, it’s advisable to have your water source tested before the plastering begins. Local swimming pool supply stores typically offer water testing services at no charge.&lt;br&gt;&lt;br&gt;-Our crew will initiate the filling process by turning on the hose and placing it in the pool. &lt;u&gt;&lt;strong&gt;It's crucial to allow the pool to fill continuously until the water reaches the center of the tile line to prevent a noticeable ring on the interior finish.&lt;/strong&gt;&lt;/u&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 18px;&quot;&gt;&amp;nbsp;&lt;/p&gt;

																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;&lt;strong&gt;Filling Your Pool&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;Right after plastering, we'll begin filling your pool until the water reaches the center of the tile line. Keep the water running continuously during this step — stopping can leave a visible ring on the new finish.&lt;/span&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 18px;&quot;&gt;&amp;nbsp;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;strong&gt;General Filling Guidelines&lt;/strong&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;-You're responsible for filling your pool and covering all related costs.&lt;br&gt;&lt;br&gt;-If your pool has an attached spa, fill the pool first and don't let spa water overflow into the pool.&lt;br&gt;&lt;br&gt;-If you're using well water:&lt;br&gt;&lt;br&gt;High mineral content can stain new plaster, so we recommend having your water tested before plastering begins. Most local pool supply stores offer free water testing.&lt;br&gt;&lt;br&gt;-Our crew will start the fill by turning on the hose and placing it in the pool. &lt;u&gt;&lt;strong&gt;Let the pool fill continuously until the water reaches the center of the tile line — stopping early can leave a visible ring on the interior finish.&lt;/strong&gt;&lt;/u&gt;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 18px;&quot;&gt;&amp;nbsp;&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 22.5px;&quot;&gt;&lt;strong&gt;Scheduling a Plaster Start-Up Company&lt;/strong&gt;&lt;br&gt;Please schedule a professional plaster start-up company to take over pool care as soon as filling is complete. They'll balance the water chemistry, which protects your new plaster's look and longevity.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Payments and Scheduling&lt;/strong&gt;&lt;br&gt;Please make sure all payments are current so we can move smoothly into this phase. For scheduling details and updates, check the client portal.&lt;br&gt;&lt;br&gt;&lt;strong&gt;Client Portal&lt;/strong&gt;&lt;br&gt;Visit the client portal anytime for your detailed schedule and the latest project updates.&lt;/p&gt;
																		&lt;p style=&quot;margin: 0; font-size: 15px; mso-line-height-alt: 18px;&quot;&gt;&amp;nbsp;&lt;/p&gt;
