, we invite you to refer to the client portal. Should you have any questions or concerns at any point, please do not hesitate to reach out to us. Yo&lt;/span&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;ur Project Manager, John Diaz, can be reached at (415) 715-7863 or feel free to reply to this email.&lt;/span&gt;&lt;br&gt;&lt;br&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;We appreciate your cooperation and are looking forward to continuing to bring your dream pool to life.&lt;/span&gt;&lt;br&gt;&lt;br&gt;&lt;span style=&quot;font-size:15px;&quot;&gt;Warm regards,&lt;/span&gt;&lt;/p&gt;
